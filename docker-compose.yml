services:
  database:
    image: postgres:16-alpine
    container_name: driver-logbook-database
    restart: unless-stopped
    environment:
      POSTGRES_DB: driverlogbook
      POSTGRES_USER: driverlogbook
      POSTGRES_PASSWORD: driverlogbook
    ports:
      - "5432:5432"
    volumes:
      - driver-logbook-data:/var/lib/postgresql/data
volumes:
  driver-logbook-data:
